[project]
name = "hostero"
version = "0.0.0"
description = "Python SDK for the Hostero API."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"
