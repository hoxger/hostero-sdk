[project]
name = "hostero"
version = "0.0.0"
description = "Python SDK for the Hostero API."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"
