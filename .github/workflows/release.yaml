name: Release Python SDK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-python-sdk
  cancel-in-progress: false

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release-please.outputs['packages/python--release_created'] }}
      tag_name: ${{ steps.release-please.outputs['packages/python--tag_name'] }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read release state
        id: release-state
        run: |
          version=$(jq --raw-output '."packages/python"' .release-please-manifest.json)
          if [ "$version" = '0.0.0' ]; then
            echo 'initialized=false' >> "$GITHUB_OUTPUT"
          else
            echo 'initialized=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Require the bootstrap release footer
        if: ${{ github.event_name == 'workflow_dispatch' && steps.release-state.outputs.initialized == 'false' }}
        run: |
          if ! git log --format=%B | grep --fixed-strings --line-regexp 'Release-As: 0.1.0-beta.1' >/dev/null; then
            echo 'The first release requires a merged commit with Release-As: 0.1.0-beta.1.' >&2
            exit 1
          fi

      - name: Run Release Please
        id: release-please
        if: ${{ github.event_name == 'workflow_dispatch' || steps.release-state.outputs.initialized == 'true' }}
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Set up uv for release pull request
        if: ${{ steps.release-please.outputs.prs_created == 'true' }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Synchronize release pull request lockfile
        if: ${{ steps.release-please.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release-please.outputs.pr }}
        run: |
          branch=$(printf '%s' "$RELEASE_PR" | jq --raw-output '.headBranchName')
          gh pr checkout "$branch"
          (
            cd packages/python
            uv lock
          )
          if git diff --quiet -- packages/python/uv.lock; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/python/uv.lock
          git commit -m 'chore(python): synchronize release lockfile'
          git push origin "HEAD:$branch"

  build:
    name: Build and verify distributions
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Run release gate
        env:
          EXPECTED_TAG: ${{ needs.release.outputs.tag_name }}
        run: task release:check

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hostero-python-${{ needs.release.outputs.tag_name }}
          path: packages/python/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: [release, build]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: hostero-python-${{ needs.release.outputs.tag_name }}
          path: dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        with:
          packages-dir: dist

  finalize:
    name: Finalize GitHub release
    needs: [release, publish]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: hostero-python-${{ needs.release.outputs.tag_name }}
          path: dist

      - name: Attach distributions and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
