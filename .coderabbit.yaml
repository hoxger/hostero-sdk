# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: "Be concise, highly technical, and actionable. Focus on correctness, performance, and API design. Avoid verbose filler."

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - "!bin/**"
    - "!dist/**"
    - "!.venv/**"
    - "!**/.pytest_cache/**"
    - "!**/.ruff_cache/**"
    - "!packages/python/uv.lock"

  path_instructions:
    - path: "packages/python/src/hostero/_generated/**"
      instructions: "These files are auto-generated by Hostero DevKit. Do not suggest direct modifications to files in this directory; suggestions should target the Go generator in `apps/devkit/internal/generator/python/` instead."

    - path: "openapi/hostero.openapi.json"
      instructions: "This OpenAPI snapshot is fetched and pinned by `hostero-devkit update`. Do not review or suggest manual modifications to this specification snapshot."

    - path: "apps/devkit/**"
      instructions: "Hostero DevKit is written in Go. Ensure idiomatic Go, strict error handling, deterministic code generation, and robust OpenAPI contract validation."

    - path: "packages/python/**"
      instructions: "Hostero Python SDK is written in modern Python (>=3.11). Ensure strict type safety, PEP 257 compliant docstrings, clean exception handling in `hostero.exceptions`, and strict credential redaction (`_redact`) so API keys are never leaked to logs or tracebacks."

chat:
  auto_reply: true
